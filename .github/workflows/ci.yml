name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The npm credits are committed. This fails when a dependency moved without
      # `pnpm credits:sync`, so the Credits page never shows an outdated list.
      - name: Check the npm credits
        run: pnpm credits:check

      # `prebuild` discovers the Glaux releases and main on GitHub, syncs the documentation of each
      # one and writes the Glaux credits of the default version. The steps below reuse that output.
      - run: pnpm build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - run: pnpm test

      - run: pnpm types:check

      - run: pnpm lint

      - run: pnpm test:worker
